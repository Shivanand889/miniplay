<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="jumpBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Neon Background -->
  <rect width="600" height="400" fill="url(#jumpBg)"/>

  <!-- Stars / Glowing Orbs -->
  <circle cx="80" cy="80" r="3" fill="#A78BFA" opacity="0.6"/>
  <circle cx="150" cy="200" r="2" fill="#38BDF8" opacity="0.8"/>
  <circle cx="520" cy="90" r="3" fill="#38BDF8" opacity="0.7"/>
  <circle cx="480" cy="280" r="2" fill="#F472B6" opacity="0.5"/>
  <circle cx="280" cy="50" r="4" fill="#67E8F9" opacity="0.7"/>

  <!-- Static Platform 1 -->
  <g transform="translate(100, 320)">
    <rect width="130" height="22" rx="11" fill="#0E7490" stroke="#22D3EE" stroke-width="3" filter="url(#neonGlow)"/>
    <line x1="20" y1="11" x2="110" y2="11" stroke="#E0F2FE" stroke-width="2"/>
  </g>

  <!-- Moving Platform 2 -->
  <g transform="translate(370, 260)">
    <rect width="120" height="22" rx="11" fill="#7C3AED" stroke="#C084FC" stroke-width="3" filter="url(#neonGlow)"/>
    <line x1="20" y1="11" x2="100" y2="11" stroke="#FAF5FF" stroke-width="2"/>
  </g>

  <!-- Spring Powerup on Platform 3 -->
  <g transform="translate(230, 180)">
    <rect width="140" height="22" rx="11" fill="#047857" stroke="#34D399" stroke-width="3" filter="url(#neonGlow)"/>
    <!-- Gold Spring -->
    <path d="M 60,0 Q 70,-8 60,-16 Q 70,-24 60,-32 L 80,-32 Q 70,-24 80,-16 Q 70,-8 80,0 Z" fill="#FBBF24" filter="url(#neonGlow)"/>
  </g>

  <!-- High Platform 4 -->
  <g transform="translate(140, 80)">
    <rect width="110" height="20" rx="10" fill="#BE185D" stroke="#F472B6" stroke-width="3" filter="url(#neonGlow)"/>
  </g>

  <!-- Jumping Neon Character -->
  <g transform="translate(270, 75)">
    <!-- Motion trails -->
    <ellipse cx="30" cy="70" rx="18" ry="6" fill="#38BDF8" opacity="0.4" filter="url(#neonGlow)"/>
    <ellipse cx="30" cy="55" rx="22" ry="8" fill="#38BDF8" opacity="0.6"/>
    <!-- Character Ball -->
    <circle cx="30" cy="25" r="28" fill="url(#neonCyan)" stroke="#E0F2FE" stroke-width="3" filter="url(#neonGlow)"/>
    <!-- Cute Eyes -->
    <circle cx="20" cy="20" r="5" fill="#0F172A"/>
    <circle cx="38" cy="20" r="5" fill="#0F172A"/>
    <circle cx="22" cy="18" r="2" fill="#FFFFFF"/>
    <circle cx="40" cy="18" r="2" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M 23,30 Q 29,36 35,30" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="25" width="140" height="34" rx="8" fill="#182234" stroke="#6366F1" stroke-width="1.5"/>
  <text x="40" y="48" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#F8FAFC">NEON JUMP</text>
</svg>
