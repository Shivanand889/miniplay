<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#cyberSky)"/>

  <!-- Cyber Grid Horizon -->
  <line x1="0" y1="180" x2="600" y2="180" stroke="#6366F1" stroke-width="2" opacity="0.4"/>

  <!-- 3-Lane Track (Perspective) -->
  <polygon points="220,180 380,180 580,400 20,400" fill="url(#trackGrad)" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Lane Divider Lines -->
  <line x1="273" y1="180" x2="206" y2="400" stroke="#38BDF8" stroke-width="3" stroke-dasharray="16 14" opacity="0.7"/>
  <line x1="327" y1="180" x2="394" y2="400" stroke="#38BDF8" stroke-width="3" stroke-dasharray="16 14" opacity="0.7"/>

  <!-- Left Barrier Hurdle -->
  <g transform="translate(130, 270)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#DC2626" stroke="#FCA5A5" stroke-width="2" filter="url(#cyanGlow)"/>
    <line x1="15" y1="0" x2="65" y2="28" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="45" y1="0" x2="95" y2="28" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Center Floating Magnet Power-Up -->
  <g transform="translate(280, 210) scale(0.7)">
    <path d="M 10,10 C 10,-20 50,-20 50,10 L 50,30 L 40,30 L 40,10 C 40,-5 20,-5 20,10 L 20,30 L 10,30 Z" fill="#EF4444" stroke="#DC2626" stroke-width="2" filter="url(#cyanGlow)"/>
    <rect x="10" y="22" width="10" height="12" fill="#E2E8F0"/>
    <rect x="40" y="22" width="10" height="12" fill="#E2E8F0"/>
  </g>

  <!-- Right Lane Overhead Slide Barrier -->
  <g transform="translate(390, 240)">
    <!-- High Clearance Arch -->
    <rect x="0" y="0" width="10" height="60" fill="#F59E0B"/>
    <rect x="80" y="0" width="10" height="60" fill="#F59E0B"/>
    <rect x="0" y="0" width="90" height="20" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.5"/>
    <text x="18" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#000000">SLIDE</text>
  </g>

  <!-- Running Cyber Character (Center Lane, Leaping) -->
  <g transform="translate(270, 260)">
    <!-- Shadow -->
    <ellipse cx="30" cy="95" rx="25" ry="8" fill="#000000" opacity="0.6"/>
    <!-- Shield Aura -->
    <circle cx="30" cy="40" r="38" fill="#38BDF8" opacity="0.2" filter="url(#cyanGlow)"/>
    <!-- Head -->
    <circle cx="30" cy="18" r="14" fill="#6366F1" stroke="#A5B4FC" stroke-width="2"/>
    <rect x="22" y="14" width="16" height="6" rx="3" fill="#38BDF8"/>
    <!-- Torso -->
    <rect x="20" y="32" width="20" height="28" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <!-- Legs Dynamic Pose -->
    <path d="M 23,60 L 15,80 L 10,88" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 37,60 L 48,72 L 54,65" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M 20,38 L 8,48 L 5,42" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
    <path d="M 40,38 L 52,48 L 58,54" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="25" width="180" height="34" rx="8" fill="#182234" stroke="#6366F1" stroke-width="1.5"/>
  <text x="36" y="48" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#F8FAFC">ENDLESS RUNNER</text>
</svg>
