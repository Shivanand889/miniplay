<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background / Sky -->
  <rect width="600" height="400" fill="#0B0F19"/>
  
  <!-- City Skyline Silhouette -->
  <polygon points="20,160 50,160 50,110 90,110 90,160 140,160 140,80 180,80 180,160 260,160 260,130 310,130 310,160 380,160 380,95 430,95 430,160 510,160 510,120 570,120 570,160 600,160 600,400 0,400 0,160" fill="#131C2E"/>

  <!-- Highway Road Perspective -->
  <polygon points="240,160 360,160 540,400 60,400" fill="url(#roadGrad)" stroke="#1F293D" stroke-width="2"/>
  <polygon points="240,160 248,160 80,400 60,400" fill="#EF4444" opacity="0.8"/>
  <polygon points="352,160 360,160 540,400 520,400" fill="#EF4444" opacity="0.8"/>

  <!-- Road Dashes -->
  <line x1="280" y1="160" x2="220" y2="400" stroke="#F8FAFC" stroke-width="4" stroke-dasharray="14 18" opacity="0.6"/>
  <line x1="320" y1="160" x2="380" y2="400" stroke="#F8FAFC" stroke-width="4" stroke-dasharray="14 18" opacity="0.6"/>

  <!-- Traffic Car Ahead (Distant) -->
  <g transform="translate(265, 185) scale(0.45)">
    <rect x="0" y="0" width="70" height="110" rx="16" fill="url(#neonCyan)"/>
    <rect x="10" y="25" width="50" height="35" rx="8" fill="#0B0F19"/>
    <circle cx="12" cy="100" r="6" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="58" cy="100" r="6" fill="#EF4444" filter="url(#glow)"/>
  </g>

  <!-- Player Car (Hero) -->
  <g transform="translate(245, 270)">
    <!-- Shadow -->
    <ellipse cx="55" cy="115" rx="55" ry="14" fill="#000000" opacity="0.6"/>
    <!-- Headlights glow beam -->
    <polygon points="20,10 -30,-100 60,-100 35,10" fill="#FEF08A" opacity="0.15"/>
    <polygon points="90,10 50,-100 140,-100 75,10" fill="#FEF08A" opacity="0.15"/>
    <!-- Car Body -->
    <rect x="10" y="10" width="90" height="105" rx="22" fill="url(#carGrad)" stroke="#F87171" stroke-width="2"/>
    <!-- Windshield -->
    <rect x="22" y="35" width="66" height="30" rx="10" fill="#0B0F19" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- Rear Window -->
    <rect x="25" y="85" width="60" height="15" rx="6" fill="#1E293B"/>
    <!-- Racing Stripes -->
    <rect x="50" y="10" width="10" height="105" fill="#FFFFFF" opacity="0.85"/>
    <!-- Headlights -->
    <polygon points="16,14 28,14 24,24 16,24" fill="#FEF08A" filter="url(#glow)"/>
    <polygon points="94,14 82,14 86,24 94,24" fill="#FEF08A" filter="url(#glow)"/>
    <!-- Taillights -->
    <rect x="16" y="108" width="16" height="5" rx="2" fill="#F87171" filter="url(#glow)"/>
    <rect x="78" y="108" width="16" height="5" rx="2" fill="#F87171" filter="url(#glow)"/>
  </g>

  <!-- Gold Coins -->
  <g transform="translate(390, 310)">
    <circle cx="20" cy="20" r="16" fill="#FBBF24" stroke="#D97706" stroke-width="3" filter="url(#glow)"/>
    <text x="14" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350F">$</text>
  </g>

  <!-- Speed Lines -->
  <line x1="90" y1="240" x2="30" y2="350" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
  <line x1="510" y1="240" x2="570" y2="350" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>

  <!-- Badge / Title -->
  <rect x="25" y="25" width="160" height="34" rx="8" fill="#182234" stroke="#6366F1" stroke-width="1.5"/>
  <text x="38" y="48" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#F8FAFC">TRAFFIC RACER</text>
</svg>
